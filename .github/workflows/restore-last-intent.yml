name: Restore lastIntent

on:
  push:
    branches:
      - feature/whatsapp-coexistence

permissions:
  contents: write

jobs:
  restore:
    if: github.event.head_commit.message != 'chore: restore lastIntent in webhook profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/whatsapp-coexistence
          fetch-depth: 0
      - name: Restore field
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/api/webhooks/whatsapp/route.ts')
          text = path.read_text(encoding='utf-8')
          if '    lastIntent: null,\n' not in text:
              old = '    lastService: null,\n    notes: null,'
              new = '    lastService: null,\n    lastIntent: null,\n    notes: null,'
              if old not in text:
                  raise SystemExit('expected emptyProfile block not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/webhooks/whatsapp/route.ts
          git diff --cached --quiet || git commit -m "chore: restore lastIntent in webhook profile"
          git push origin feature/whatsapp-coexistence
