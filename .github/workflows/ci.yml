name: CI

on:
  push:
    branches:
      - main
      - feature/whatsapp-coexistence
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # Valores sintéticos somente para permitir o build no CI.
  # Nunca são usados para acessar o Firebase de produção.
  FIREBASE_PROJECT_ID: ci-livia
  FIREBASE_CLIENT_EMAIL: ci@ci-livia.iam.gserviceaccount.com
  FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\\nci-only\\n-----END PRIVATE KEY-----\\n"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
